<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cut Tracker</title>

  <!-- Иконки: favicon и apple-touch-icon генерируются из SVG ниже -->
  <link rel="icon" id="favicon" href="" />
  <link rel="apple-touch-icon" id="apple-icon" href="" />

  <!-- iOS: запуск как приложение с главного экрана -->
  <meta name="theme-color" content="#07080c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cut" />

  <style>
    :root {
      --bg: #07080c;
      --card: rgba(255, 255, 255, 0.045);
      --card-strong: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.08);
      --text: #eef0f6;
      --muted: #8b93a7;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --good: #34d399;
      --bad: #ff4d6d;
      --ease: cubic-bezier(0.22, 0.8, 0.3, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: -20% -20% auto -20%;
      height: 60vh;
      background: radial-gradient(closest-side, rgba(124, 92, 255, 0.35), transparent);
      filter: blur(40px);
      z-index: -1;
      pointer-events: none;
      animation: float 14s ease-in-out infinite alternate;
    }
    @keyframes float { to { transform: translate(8%, 6%) scale(1.12); } }

    /* ---------- header ---------- */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 8px;
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 6px 20px rgba(124, 92, 255, 0.35); }
    h1 { font-size: 24px; margin: 0; letter-spacing: -0.5px; }
    h2 { font-size: 20px; margin: 4px 0 8px; }
    .eyebrow { margin: 0; color: var(--muted); font-size: 13px; text-transform: capitalize; }

    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--card);
      color: var(--text); font-size: 18px; cursor: pointer;
      transition: transform 0.3s var(--ease), background 0.3s;
    }
    .icon-btn:active { transform: scale(0.9) rotate(30deg); }

    main { padding: 8px 16px; }

    /* ---------- screens ---------- */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeUp 0.55s var(--ease) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }

    /* ---------- cards ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: border-color 0.5s, box-shadow 0.5s, transform 0.3s var(--ease);
    }
    .card.mini { padding: 16px; }
    .progress-card { background: linear-gradient(160deg, var(--card-strong), var(--card)); }

    .is-alert {
      border-color: rgba(255, 77, 109, 0.6) !important;
      box-shadow: 0 0 0 1px rgba(255, 77, 109, 0.25), 0 12px 40px rgba(255, 77, 109, 0.22);
      animation: shake 0.55s var(--ease);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .good-text { color: var(--good); }
    .bad-text { color: var(--bad); }

    .label {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.9px;
      margin: 0 0 8px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .between { justify-content: space-between; }

    .pill {
      font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 99px;
      background: rgba(124, 92, 255, 0.18); color: #c9bbff;
    }

    /* ---------- big numbers / progress ---------- */
    .big-number {
      font-size: 56px; font-weight: 700; letter-spacing: -2px;
      font-variant-numeric: tabular-nums; line-height: 1.05;
      margin-bottom: 16px;
    }
    .big-number.small { font-size: 38px; }

    .progress-track {
      height: 14px; border-radius: 99px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden; margin: 6px 0 10px;
    }
    .progress-fill {
      height: 100%; width: 0; border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 1.3s var(--ease), background 0.5s;
      box-shadow: 0 0 18px rgba(124, 92, 255, 0.5);
    }
    .progress-fill.bad {
      background: linear-gradient(90deg, #ff4d6d, #ff8a5c);
      box-shadow: 0 0 18px rgba(255, 77, 109, 0.6);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse { 50% { filter: brightness(1.35); } }

    .to-go { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

    .big-delta {
      font-size: 40px; font-weight: 700; margin: 0 0 6px;
      font-variant-numeric: tabular-nums; letter-spacing: -1px;
    }
    .big-delta.good-text { color: var(--good); }
    .big-delta.bad-text { color: var(--bad); }
    .status-msg { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
    .status-card.is-alert .status-msg { color: #ffb3c1; }

    .mini-val { font-size: 20px; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat-grid .card { margin: 0; padding: 16px; animation: fadeUp 0.6s var(--ease) both; }
    .stat-grid .card:nth-child(2) { animation-delay: 0.06s; }
    .stat-grid .card:nth-child(3) { animation-delay: 0.12s; }
    .stat-grid .card:nth-child(4) { animation-delay: 0.18s; }
    .stat-grid .card:nth-child(5) { animation-delay: 0.24s; }
    .stat-grid .card:nth-child(6) { animation-delay: 0.30s; }
    .stat-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 0; }

    /* ---------- form ---------- */
    .entry-form label {
      display: flex; flex-direction: column; gap: 6px;
      font-size: 13px; color: var(--muted); margin-bottom: 12px;
    }
    .entry-form .grid-2 { gap: 12px; }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      color-scheme: dark;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.2);
    }

    button { font-family: inherit; }
    .primary, .ghost, .danger {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: 0;
      transition: transform 0.2s var(--ease), filter 0.2s, background 0.3s;
      margin-top: 4px;
    }
    .primary {
      background: linear-gradient(90deg, var(--accent), #5b8cff);
      color: #fff;
      box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35);
    }
    .ghost {
      background: var(--card-strong);
      color: var(--text);
      border: 1px solid var(--line);
      width: auto;
      padding: 12px 16px;
    }
    .danger {
      background: rgba(255, 77, 109, 0.12);
      color: var(--bad);
      border: 1px solid rgba(255, 77, 109, 0.3);
    }
    .primary:active, .ghost:active, .danger:active { transform: scale(0.97); }
    .file-label { display: inline-flex; align-items: center; cursor: pointer; }

    /* ---------- stats / charts ---------- */
    .chart { width: 100%; height: auto; display: block; overflow: visible; }
    .chart .grid { stroke: rgba(255, 255, 255, 0.06); }
    .chart .axis { fill: var(--muted); font-size: 10px; }
    .chart .goal { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 6 6; opacity: 0.7; }
    .chart .goal-label { fill: var(--good); font-size: 10px; }
    .chart .area { animation: fadeIn 1.2s 0.4s both; }
    .chart .dot {
      animation: pop 0.45s var(--ease) both;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pop { from { opacity: 0; transform: scale(0); } }
    @keyframes fadeIn { from { opacity: 0; } }

    .bars {
      display: flex; align-items: flex-end; gap: 4px;
      height: 130px; padding-top: 8px;
    }
    .bar-col {
      flex: 1; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      gap: 4px;
    }
    .bar-col span { font-size: 9px; color: var(--muted); }
    .bar {
      width: 100%; height: var(--h); min-height: 6px;
      border-radius: 6px 6px 2px 2px;
      transform-origin: bottom;
      animation: grow 0.9s var(--ease) both;
    }
    .bar.bad { background: linear-gradient(#ff4d6d, rgba(255, 77, 109, 0.3)); }
    .bar.good { background: linear-gradient(#34d399, rgba(52, 211, 153, 0.3)); }
    @keyframes grow { from { transform: scaleY(0); } }

    table.weeks { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    table.weeks th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 4px; }
    table.weeks td { padding: 10px 4px; border-top: 1px solid var(--line); }

    .hist-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--line);
    }
    .hist-row:last-child { border-bottom: 0; }
    .hist-row button {
      background: none; border: 0; color: var(--muted);
      font-size: 16px; cursor: pointer; padding: 6px;
    }
    .hist-row button:hover { color: var(--bad); }
    .empty { color: var(--muted); font-size: 14px; margin: 8px 0; }

    /* ---------- insights ---------- */
    .insight {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 0; border-bottom: 1px solid var(--line);
      animation: fadeUp 0.5s var(--ease) both;
    }
    .insight:last-child { border-bottom: 0; }
    .insight p { margin: 0; font-size: 15px; line-height: 1.45; }
    .insight .dot-i {
      flex: 0 0 10px; height: 10px; border-radius: 50%; margin-top: 6px;
      background: var(--muted); box-shadow: 0 0 12px currentColor;
    }
    .insight.good .dot-i { background: var(--good); color: var(--good); }
    .insight.warn .dot-i { background: #fbbf24; color: #fbbf24; }
    .insight.bad .dot-i { background: var(--bad); color: var(--bad); }

    /* ---------- tabbar ---------- */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: space-around;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(12, 13, 20, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-top: 1px solid var(--line);
      z-index: 10;
      overflow: hidden;
    }
    .tab {
      flex: 1; background: none; border: 0;
      color: var(--muted); font-size: 12px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer;
      position: relative; z-index: 1;
      transition: color 0.3s, transform 0.4s var(--ease);
    }
    .tab .ico { font-size: 20px; transition: transform 0.4s var(--ease); }
    .tab.active { color: var(--text); }
    .tab.active .ico { transform: scale(1.15); color: var(--accent-2); }

    /* линза под активной вкладкой */
    .tab-pill {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 12px;
      width: calc((100% - 24px) / 3);
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.05));
      backdrop-filter: blur(10px) saturate(180%);
      -webkit-backdrop-filter: blur(10px) saturate(180%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.45),
        inset 0 -1px 0 rgba(255,255,255,0.08),
        0 8px 24px rgba(0,0,0,0.35);
      transition: transform 0.65s cubic-bezier(0.34, 1.45, 0.64, 1);
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- переход между разделами ---------- */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.45s;
      animation-timing-function: var(--ease);
    }
    ::view-transition-old(root) { animation-name: vt-out; }
    ::view-transition-new(root) { animation-name: vt-in; }
    @keyframes vt-out {
      to { opacity: 0; transform: translateX(-24px) scale(0.98); }
    }
    @keyframes vt-in {
      from { opacity: 0; transform: translateX(24px) scale(0.98); }
    }
